<mat-card class="reset-password-card">
    <mat-card-header>
        <mat-card-title>Redefinir Senha</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <mat-stepper 
            #stepper 
            [linear]="true" 
            orientation="horizontal" 
            class="stepper-no-header"> 
            
            <mat-step [stepControl]="emailFormGroupPlaceholder" [completed]="emailSentSuccessfully">
                <ng-template matStepLabel>1. Informe seu E-mail</ng-template>
                
                <app-email-send-form
                    (emailSubmitted)="handleEmailSubmit($event)">
                </app-email-send-form>
            </mat-step>

            <mat-step [stepControl]="passwordFormGroupPlaceholder">
                <ng-template matStepLabel>2. Redefinir a Senha</ng-template>

                <app-reset-password
                    [email]="userEmail" 
                    (passwordSubmitted)="handlePasswordReset($event)">
                </app-reset-password>

                <div class="mt-4 form-actions-button">
                    <button mat-button matStepperPrevious>
                        <mat-icon>arrow_back</mat-icon> Voltar
                    </button>
                </div>
            </mat-step>

        </mat-stepper>
    </mat-card-content>
</mat-card>
